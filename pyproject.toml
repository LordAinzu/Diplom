[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowblind-demo"
version = "0.1.0"
description = "Educational SB+ threshold blind signature services"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1",
  "cryptography==50.0.1", "pycryptodome==3.23.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
snowblind = "snowblind.cli:main"

[tool.setuptools.packages.find]
include = ["snowblind*"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]

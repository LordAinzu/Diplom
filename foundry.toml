[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin-contracts/contracts/"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 256
